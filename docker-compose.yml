# Tum sistemi ayaga kaldirir: veritabani, e-posta yakalayici, backend, arayuz.
#
#   docker compose up                 -> her sey (depoyu ilk kez deneyen icin)
#   docker compose up db mailpit      -> yalniz bagimliliklar (ekip gelistirmesi:
#                                        backend/frontend elle, hizli yeniden
#                                        yukleme ile calistirilir)
#
# GUVENLIK — bu dosya YEREL kullanim icindir:
#
#   * Asagidaki varsayilan sifreler ve SECRET_KEY depoda ACIK duruyor; yani
#     herkes tarafindan bilinebilir. Bu anahtarla imzalanan bir JWT taklit
#     edilebilir -- depoyu okuyan biri kendini yonetici ilan edebilirdi.
#   * Bu yuzden yayinlanan portlarin HEPSI 127.0.0.1'e baglidir: konteynerler
#     yalniz bu makineden erisilebilir, agdan DEGIL. Sunucuya kurup disariya
#     acmak isteyen, bagi bilerek genisletmek zorunda kalir -- ve o an
#     asagidaki degerleri de vermek zorundadir.
#   * Her deger ortam degiskeniyle ezilebilir (${DEGISKEN:-varsayilan}). Ornek:
#       ENVIRONMENT=production SECRET_KEY=<rastgele> DB_PASSWORD=<gizli>
#       ADMIN_PASSWORD=<gizli> docker compose up
#     Rastgele anahtar uretmek icin:
#       python -c "import secrets; print(secrets.token_urlsafe(48))"
#     ENVIRONMENT=production, dev varsayilanlarindan biri kalmissa uygulamanin
#     ACILMASINI REDDEDER (app/config.py).

x-backend-ortam: &backend-ortam
  DATABASE_URL: postgresql+psycopg://app:${DB_PASSWORD:-app_dev_password}@db:5432/scheduling
  # Mailpit: mailler internete CIKMAZ, http://localhost:8025 adresinde birikir.
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_STARTTLS: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  MAIL_FROM: no-reply@muh.example.edu.tr
  # Davet ve sifre sifirlama linkleri bu adresten uretilir; tarayicinin
  # arayuzu gordugu adresle ayni olmali, yoksa link calismaz.
  FRONTEND_BASE_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080
  ALLOWED_EMAIL_DOMAINS: muh.example.edu.tr,gmail.com,hotmail.com,outlook.com
  SECRET_KEY: ${SECRET_KEY:-yerel-deneme-icin-anahtar-yayinda-degismeli}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  # bootstrap.py bunlari okur; verilmezse belgelenmis varsayilanlar kullanilir.
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@muh.example.edu.tr}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
  RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}

services:
  db:
    image: postgres:16
    container_name: scheduling_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_dev_password}
      POSTGRES_DB: scheduling
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d scheduling"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: scheduling_mail
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  # Tek seferlik: sema kurulumu + acilis asgarisi (workgroup + yonetici).
  # Bitince kapanir.
  # backend bunun BASARIYLA bitmesini bekler; yarim sema uzerinde acilmaz.
  init:
    build: ./backend
    container_name: scheduling_init
    command: python bootstrap.py
    environment: *backend-ortam
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    container_name: scheduling_api
    environment: *backend-ortam
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # Imajda curl yok; python zaten var.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"]
      # 30s: saglik kontrolu bir gozetim araci, log kaynagi degil.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: scheduling_web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
