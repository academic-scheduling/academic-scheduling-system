server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Yukleme boyutu: ders/hoca listesi iceren XLSX dosyalari iceri aktariliyor.
    client_max_body_size 16m;

    # --- Guvenlik basliklari ---
    # Oturum token'i localStorage'da duruyor; yani sayfada calisan HERHANGI bir
    # yabanci script onu okuyabilir. Uygulamada XSS yuzeyi dar (React varsayilan
    # olarak kacisliyor, kodda tek bir dangerouslySetInnerHTML yok) ama bu tek
    # savunma katmani olarak kalmamali -- asagidaki CSP, yabanci bir script'in
    # calismasini en basta engeller.
    #
    # NOT (nginx kurali): add_header YALNIZ, alt blokta hic add_header yoksa
    # miras alinir. /assets/ kendi Cache-Control'unu ekledigi icin bu basliklari
    # KAYBEDERDI; oraya bilerek tekrarlandilar (asagi bakiniz).
    #
    # style-src'de 'unsafe-inline' zorunlu: Mantine stillerini calisma aninda
    # <style> olarak enjekte eder. Script tarafinda 'unsafe-inline' YOK -- asil
    # koruma orada.
    # www.google.com / www.gstatic.com: reCAPTCHA v2 (K-44). Anahtar tanimli
    # degilken kutu hic cizilmez, ama izin acik kalirsa acildiginda calisir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Tiklama hirsizligi: uygulamayi baska bir sitenin cercevesine koymayi kapatir
    # (CSP frame-ancestors'in eski tarayicilardaki karsiligi).
    add_header X-Frame-Options "DENY" always;
    # Tarayici, sunucunun bildirdigi Content-Type'i tahminle degistirmesin.
    add_header X-Content-Type-Options "nosniff" always;
    # Davet/sifirlama linkleri adres cubugunda TOKEN tasiyor; tam URL'in disari
    # Referer olarak sizmamasi icin yalniz kaynak gonderilir.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Uygulamanin ihtiyac duymadigi guclu tarayici yetenekleri kapatilir.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # --- API ---
    # location "/api/" ve proxy_pass'in sonundaki "/" birlikte oneki SOYAR:
    #   tarayici  /api/courses  ->  backend  /courses
    # Bu, gelistirmedeki vite proxy'siyle (rewrite: ^/api -> "") birebir ayni
    # sozlesme. Frontend kodu iki ortamda da ayni yolu kullanir; "yayinda
    # farkli davraniyor" sinifi hatalar bu yuzden dogmaz.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel export'u buyuk olabilir; varsayilan 60sn yetmezse burasi artar.
        proxy_read_timeout 120s;
    }

    # --- SPA ---
    # React Router adresleri (ornegin /activate?token=...) sunucuda dosya
    # KARSILIGI OLMAYAN yollardir. try_files olmadan nginx 404 doner ve davet
    # linkine tiklayan kullanici bos sayfa gorur. Istek once dosya olarak
    # aranir, bulunamazsa index.html'e dusurulur; yonlendirmeyi React yapar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite ciktisindaki dosya adlari icerik ozetini tasir (app-a3f9c1.js), yani
    # icerik degisince ad da degisir. Bu yuzden uzun onbellek guvenli.
    location /assets/ {
        # Tek bir Cache-Control uretiliyor: "expires" direktifi de kendi
        # Cache-Control'unu ekler ve ikisi birlikte cift baslik dogurur
        # (curl ile gorulur). Deger tek yerde dursun.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Bu blokta add_header bulundugu icin server duzeyindekiler miras
        # ALINMAZ; guvenlik basliklari burada tekrar edilmeli. Ozellikle
        # nosniff: bir .js dosyasinin baska bir tur gibi yorumlanmasini keser.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.gstatic.com; font-src 'self' data:; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
}
